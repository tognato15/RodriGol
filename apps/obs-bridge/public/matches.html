<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>RodriGol — Editor de Partidas</title><link href="/control/editor.css" rel="stylesheet"/><link href="/control/design-system.css" rel="stylesheet"/><link href="/control/admin-consolidation.css" rel="stylesheet"/><link href="/control/global-nav.css" rel="stylesheet"/></head><body>
<header class="topbar"><div class="brand">RODRIGOL <b>STUDIO</b></div><h1>EDITOR DE PARTIDAS</h1><div class="actions"><a class="btn" href="/control/">Abrir Cabine</a><button class="btn primary" id="newMatch">+ Nova partida</button></div></header>
<div class="layout"><aside class="sidebar"><h4>OPERAÇÃO</h4><a href="/control/production.html">▦ Central de Produção</a><a href="/control/central.html">▣ Central de Coberturas</a><h4>CADASTROS</h4><a href="/control/clubs.html">⚽ Editor de Clubes</a><a class="active" href="/control/matches.html">▣ Editor de Partidas</a><a href="/control/competitions.html">🏆 Editor de Competições</a><h4>OPERAÇÃO</h4><a href="/control/">◉ Cabine de Cobertura</a><a href="/control/history.html">◷ Histórico</a></aside><main class="workspace">
<section class="panel"><div class="toolbar"><input id="search" placeholder="Buscar partida, competição, clube..."/><select id="bucketFilter"><option value="ALL">Todas</option><option value="UPCOMING">Próximas</option><option value="OPERATIONAL">Em operação</option><option value="FINISHED">Finalizadas</option><option value="ARCHIVED">Arquivo</option></select><span id="count"></span></div><div class="notice" id="notice"></div></section>
<section class="panel"><h2 id="formTitle">Nova partida</h2><form id="matchForm"><input id="matchId" type="hidden"/><div class="field-grid">
<label>Competição<select id="competition" required=""></select></label><label>Temporada<input id="season" value="2026"/></label><label>Fase<select id="stageId"></select></label><label>Grupo<select id="groupId"></select></label><label>Rodada<select id="roundId"></select></label><input id="round" type="hidden"/>
<label>Mandante<select id="homeClubId" required=""></select></label><label>Visitante<select id="awayClubId" required=""></select></label><label>Situação inicial<select id="status"><option value="SCHEDULED">Programada</option><option value="PRE_GAME">Pré-jogo</option><option value="FIRST_HALF">1º tempo</option><option value="HALFTIME">Intervalo</option><option value="SECOND_HALF">2º tempo</option><option value="FINAL">Finalizada</option></select></label>
<label>Data<input id="date" required="" type="date"/></label><label>Horário<input id="time" required="" type="time"/></label><label>Árbitro<input id="referee" placeholder="Nome do árbitro"/></label>
<label>Público<input id="attendance" inputmode="numeric" placeholder="Ex.: 43.275"/></label><label>Clima<input id="weather" placeholder="Ex.: 21°C · Nublado"/><button class="weather-action" id="fetchWeather" type="button">☁ Buscar clima agora</button><small class="weather-status" id="weatherLookupStatus"></small></label><label>Cidade / local<input id="city" placeholder="Ex.: São Paulo"/></label>
<label class="wide">Estádio<input id="venue"/></label><label class="full">Observações<textarea id="notes"></textarea></label>
<div class="full toolbar"><button class="btn primary" type="submit">Salvar partida</button><button class="btn" id="cancelEdit" type="button">Limpar formulário</button></div></div></form></section>
<section class="panel"><h3>PARTIDAS CADASTRADAS</h3><div id="matchList"></div></section></main></div><script src="/control/matches.js" type="module"></script><script defer="True" src="/control/global-nav.js"></script></body></html>
