<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RodriGol — Editor de Partidas</title><link rel="stylesheet" href="/control/editor.css"></head><body>
<header class="topbar"><div class="brand">RODRIGOL <b>TV</b><small>SISTEMA OPERACIONAL DE REDAÇÃO ESPORTIVA</small></div><h1>EDITOR DE PARTIDAS</h1><div class="actions"><a class="btn" href="/control/">Abrir Cabine</a><button class="btn primary" id="newMatch">+ Nova partida</button></div></header>
<div class="layout"><aside class="sidebar"><h4>OPERAÇÃO</h4><a href="/control/central.html">▣ Central de Coberturas</a><h4>CADASTROS</h4><a href="/control/clubs.html">⚽ Editor de Clubes</a><a class="active" href="/control/matches.html">▣ Editor de Partidas</a><h4>OPERAÇÃO</h4><a href="/control/">◉ Cabine de Cobertura</a></aside><main class="workspace">
<section class="panel"><div class="toolbar"><input id="search" placeholder="Buscar partida, competição, clube..."><span id="count"></span></div><div id="notice" class="notice"></div></section>
<section class="panel"><h2 id="formTitle">Nova partida</h2><form id="matchForm"><input id="matchId" type="hidden"><div class="field-grid">
<label>Competição<input id="competition" required value="Brasileirão Série A"></label><label>Temporada<input id="season" value="2026"></label><label>Rodada / fase<input id="round" value="9ª Rodada"></label>
<label>Mandante<select id="homeClubId" required></select></label><label>Visitante<select id="awayClubId" required></select></label><label>Situação inicial<select id="status"><option value="PRE_GAME">Pré-jogo</option><option value="FIRST_HALF">1º tempo</option><option value="HALFTIME">Intervalo</option><option value="SECOND_HALF">2º tempo</option><option value="FINAL">Finalizada</option></select></label>
<label>Data<input id="date" type="date" required></label><label>Horário<input id="time" type="time" required></label><label>Árbitro<input id="referee"></label>
<label class="wide">Estádio<input id="venue"></label><label>Cidade / local<input id="city"></label><label class="full">Observações<textarea id="notes"></textarea></label>
<div class="full toolbar"><button class="btn primary" type="submit">Salvar partida</button><button class="btn" type="button" id="cancelEdit">Limpar formulário</button></div></div></form></section>
<section class="panel"><h3>PARTIDAS CADASTRADAS</h3><div id="matchList"></div></section></main></div><script type="module" src="/control/matches.js"></script></body></html>
