<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RodriGol — Editor de Rodadas</title><link rel="stylesheet" href="/control/editor.css"><link rel="stylesheet" href="/control/design-system.css"><link rel="stylesheet" href="/control/admin-consolidation.css"><link rel="stylesheet" href="/control/global-nav.css"><style>.round-kpis{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:10px;margin:12px 0}.round-kpis div{background:#071b26;border:1px solid #284b5e;border-radius:8px;padding:12px}.round-kpis b{display:block;font-size:24px;color:#ff5b00}.round-kpis small{color:#9dc1d4}.round-state{margin:8px 0 16px;font-weight:800;color:#fff}.round-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#123448;color:#bfe7ff;font-weight:800;font-size:12px}.round-badge.pending{background:#5b2200;color:#ffd3b3}</style></head><body>
<header class="topbar"><div class="brand">RODRIGOL <b>STUDIO</b></div><h1>EDITOR DE RODADAS</h1><div class="actions"><a class="btn" href="/control/competitions.html">Competições</a><button class="btn primary" id="newRound">+ Nova rodada</button></div></header>
<div class="layout"><aside class="sidebar"></aside><main class="workspace">
<section class="panel"><div class="toolbar"><label>Competição<select id="filterCompetition"></select></label><label>Temporada<input id="filterSeason" value="2026"></label><label>Fase<select id="filterStage"></select></label><label>Grupo<select id="filterGroup"></select></label><button class="btn" id="applyFilter">Aplicar</button></div><div class="notice" id="notice"></div></section>
<section class="panel"><h2 id="formTitle">Nova rodada</h2><form id="roundForm"><input type="hidden" id="roundId"><div class="field-grid"><label>Competição<select id="competitionId" required></select></label><label>Temporada<input id="season" required value="2026"></label><label>Fase<select id="stageId" required></select></label><label>Grupo<select id="groupId"></select></label><label>Nome<input id="name" required placeholder="Rodada 1"></label><label>Ordem<input id="order" type="number" min="1" value="1"></label><label>Data inicial<input id="startDate" type="date"></label><label>Data final<input id="endDate" type="date"></label><label class="full">Observações<textarea id="notes"></textarea></label><div class="full toolbar"><button class="btn primary">Salvar rodada</button><button type="button" class="btn" id="clearForm">Limpar</button></div></div></form></section>
<section class="panel"><h3>GERAÇÃO AUTOMÁTICA</h3><div class="toolbar"><label>Quantidade<input id="batchCount" type="number" min="1" value="38"></label><label>Número inicial<input id="batchStart" type="number" min="1" value="1"></label><label>Prefixo<input id="batchPrefix" value="Rodada"></label><button class="btn primary" id="generateRounds">Criar rodadas</button></div></section>
<section class="panel"><div class="toolbar"><h3>RODADAS CADASTRADAS</h3><span id="count"></span></div><div id="roundList"></div></section><section class="panel" id="roundDetails" hidden><div class="toolbar"><h3 id="roundDetailsTitle">JOGOS DA RODADA</h3><div class="row-actions"><button class="btn primary" id="completeRound">Concluir rodada</button><button class="btn" id="archiveRound">Arquivar rodada</button><button class="btn" id="closeRoundDetails">Fechar</button></div></div><div id="roundProgress"></div><div id="roundMatchList"></div></section>
</main></div><script type="module" src="/control/rounds.js"></script><script defer src="/control/global-nav.js"></script></body></html>
