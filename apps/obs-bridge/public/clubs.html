<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RodriGol — Editor de Clubes</title><link rel="stylesheet" href="/control/editor.css"></head><body>
<header class="topbar"><div class="brand">RODRIGOL <b>TV</b><small>SISTEMA OPERACIONAL DE REDAÇÃO ESPORTIVA</small></div><h1>EDITOR DE CLUBES</h1><div class="actions"><a class="btn" href="/control/">Abrir Cabine</a><button class="btn primary" id="newClub">+ Novo clube</button></div></header>
<div class="layout"><aside class="sidebar"><h4>OPERAÇÃO</h4><a href="/control/central.html">▣ Central de Coberturas</a><h4>CADASTROS</h4><a class="active" href="/control/clubs.html">⚽ Editor de Clubes</a><a href="/control/matches.html">▣ Editor de Partidas</a><h4>OPERAÇÃO</h4><a href="/control/">◉ Cabine de Cobertura</a></aside><main class="workspace">
<section class="panel"><div class="toolbar"><input id="search" placeholder="Buscar clube, cidade, sigla..."><span id="count"></span></div><div id="notice" class="notice"></div></section>
<section class="panel"><div class="form-head"><div id="crestPreview" class="crest-preview">EC</div><div><h2 id="formTitle">Novo clube</h2><small>Cadastre a identidade completa da equipe.</small></div></div><form id="clubForm"><input id="clubId" type="hidden"><div class="field-grid">
<label>Nome oficial<input id="name" required></label><label>Nome curto<input id="shortName" required></label><label>Sigla<input id="abbreviation" maxlength="5" required></label>
<label>Cidade<input id="city"></label><label>Estado<input id="state" maxlength="3"></label><label>País<input id="country" value="Brasil"></label>
<label>Estádio<input id="stadium"></label><label>Data de fundação<input id="founded" type="date"></label><label>Texto do escudo<input id="crestText" maxlength="4"></label>
<div class="full color-row"><label>Cor primária<input id="primaryColor" type="color" value="#1f6f43"></label><label>Cor secundária<input id="secondaryColor" type="color" value="#ffffff"></label><label>Cor terciária<input id="tertiaryColor" type="color" value="#0d3b24"></label></div>
<label class="full">Arquivo do escudo (PNG, JPG, SVG ou WEBP)<input id="crestFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>
<div class="full toolbar"><button class="btn primary" type="submit">Salvar clube</button><button class="btn" type="button" id="cancelEdit">Limpar formulário</button></div></div></form></section>
<section class="panel"><h3>CLUBES CADASTRADOS</h3><div id="clubList"></div></section></main></div><script type="module" src="/control/clubs.js"></script></body></html>
